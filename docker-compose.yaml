services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_DB: "tgbot"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      # Дамп для первичной инициализации базы (файл в корне проекта).
      - ./db_dump.bak:/docker-entrypoint-initdb.d/dump.sql
