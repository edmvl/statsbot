services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_DB: "tgbot"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      # Дамп для первичной инициализации базы. В репозитории его нет (см. README):
      # положите сюда обычный SQL-дамп, иначе контейнер не поднимется.
      - ./tgbot_dump:/docker-entrypoint-initdb.d/dump.sql
