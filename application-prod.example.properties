# Шаблон ПРОДА (коммитится, без секретов).
# Как пользоваться: скопировать в config/application-prod.properties (папка в .gitignore)
# и подставить реальные значения. Запуск: SPRING_PROFILES_ACTIVE=prod.

telegram.bot.username=your_prod_bot
telegram.bot.token=REPLACE_WITH_REAL_PROD_TOKEN
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/tgbot
spring.datasource.username=postgres
spring.datasource.password=REPLACE_WITH_REAL_PASSWORD

# Ключ JavaScript API Яндекс.Карт для страниц квестов.
# Можно оставить пустым — тогда карта отключена, координаты вводятся вручную.
yandex.maps.api-key=
