<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Отзывы о пользователе</title>
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=10)}" data-back="/app/trips" defer></script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
            margin: 0;
            background: var(--page-bg);
            color: var(--text);
        }

        h1 {
            font-size: 22px;
            margin: 0 0 16px;
        }

        .driver {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--line);
            background: var(--soft);
            flex: 0 0 auto;
        }

        .avatar-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--soft);
            color: var(--muted);
            font-size: 22px;
            font-weight: 600;
            border: 1px solid var(--line);
            flex: 0 0 auto;
        }

        .driver-name {
            font-size: 18px;
            font-weight: 600;
        }

        .username {
            color: var(--muted);
            font-size: 14px;
        }

        .driver-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 10px;
        }

        .user-id {
            color: var(--muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .review {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .review-header .avatar,
        .review-header .avatar-placeholder {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }

        .review-author-name {
            font-weight: 600;
            word-break: break-word;
        }

        .review-stars {
            margin-left: auto;
            color: var(--star);
            font-weight: 700;
            white-space: nowrap;
        }

        .review-comment {
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .no-comment,
        .empty {
            color: var(--muted);
            font-style: italic;
        }

        .history {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 20px;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .history-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            align-items: baseline;
            padding: 5px 0;
            font-size: 14px;
        }

        .history-row + .history-row {
            border-top: 1px solid var(--line-soft);
        }

        .history-date {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .history-name {
            font-weight: 500;
            word-break: break-word;
        }

        .history-username {
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>
<body>
<h1>Отзывы о пользователе</h1>

<div class="driver">
    <img class="avatar" th:if="${driver != null and !#strings.isEmpty(driver.avatarPath)}"
         th:src="@{/avatar/{id}(id=${driverId})}" alt=""/>
    <span class="avatar-placeholder" th:if="${driver == null or #strings.isEmpty(driver.avatarPath)}"
          th:text="${(driver != null and !#strings.isEmpty(driver.firstName)) ? #strings.substring(driver.firstName,0,1) : '👤'}">👤</span>
    <div>
        <div class="driver-name"
             th:text="${driver != null and !#strings.isEmpty(driver.firstName)
                     ? (driver.firstName + ' ' + (driver.lastName != null ? driver.lastName : ''))
                     : 'Пользователь'}">Имя</div>
        <div class="driver-meta">
            <span class="username" th:if="${driver != null and !#strings.isEmpty(driver.userName)}"
                  th:text="'@' + ${driver.userName}"></span>
            <span class="user-id" th:text="'ID ' + ${driverId}">ID 123456</span>
        </div>
    </div>
</div>

<!-- История изменений данных пользователя (ФИО/ник) -->
<div class="history" th:if="${!#lists.isEmpty(history)}">
    <div class="history-title">🕓 История изменений данных</div>
    <div class="history-row" th:each="entry : ${history}">
        <span class="history-date"
              th:text="${entry.changedAt != null ? #temporals.format(entry.changedAt, 'dd.MM.yyyy HH:mm') : '—'}">01.01.2026 12:00</span>
        <span class="history-name"
              th:text="${!#strings.isEmpty(entry.firstName)
                      ? (entry.firstName + ' ' + (entry.lastName != null ? entry.lastName : ''))
                      : (!#strings.isEmpty(entry.userName) ? '@' + entry.userName : '—')}">Имя</span>
        <span class="history-username"
              th:if="${!#strings.isEmpty(entry.userName) and !#strings.isEmpty(entry.firstName)}"
              th:text="'@' + ${entry.userName}"></span>
    </div>
</div>

<div th:if="${#lists.isEmpty(reviews)}" class="empty">Пока нет отзывов</div>

<div class="review" th:each="review : ${reviews}">
    <div class="review-header">
        <img class="avatar" th:if="${review.avatarPath}"
             th:src="@{/avatar/{id}(id=${review.reviewUserId})}" alt=""/>
        <span class="avatar-placeholder" th:unless="${review.avatarPath}"
              th:text="${#strings.isEmpty(review.firstName) ? '👤' : #strings.substring(review.firstName,0,1)}">👤</span>
        <div>
            <div class="review-author-name"
                 th:text="${(review.firstName != null ? review.firstName : '') + ' ' + (review.lastName != null ? review.lastName : '')}">Имя</div>
            <div class="username" th:if="${review.userName}" th:text="'@' + ${review.userName}"></div>
        </div>
        <div class="review-stars" th:text="'★ ' + ${review.stars}">★ 5</div>
    </div>
    <div class="review-comment" th:if="${review.comment}" th:text="${review.comment}">Комментарий</div>
    <div class="review-comment no-comment" th:unless="${review.comment}">Без комментария</div>
</div>
</body>
</html>
