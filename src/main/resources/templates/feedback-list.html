<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Жалобы</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=12)}" data-back="/app" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 20px 16px 48px;
            margin: 0 auto;
            max-width: 820px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .page-header h1 {
            font-size: 23px;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            border-radius: var(--radius-pill);
            background: var(--soft);
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid var(--line-soft);
            white-space: nowrap;
        }

        th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            font-weight: 700;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .who {
            white-space: normal;
            word-break: break-word;
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
        }

        .status-open {
            background: rgba(245, 158, 11, 0.18);
            color: #c98a00;
        }

        .status-closed {
            background: rgba(46, 158, 91, 0.18);
            color: var(--good);
        }

        td a {
            color: var(--link);
            font-weight: 600;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 36px 12px;
        }

        .footer-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--link);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header class="page-header">
    <h1>📨 Жалобы</h1>
    <span class="count-badge" th:text="${#lists.size(feedbacks)}">0</span>
</header>

<div th:if="${#lists.isEmpty(feedbacks)}" class="empty">Жалоб пока нет</div>

<div class="table-wrap" th:if="${!#lists.isEmpty(feedbacks)}">
    <table>
        <thead>
        <tr>
            <th>№</th>
            <th>Когда</th>
            <th>От кого</th>
            <th>На кого</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="feedback : ${feedbacks}">
            <td>
                <a th:href="@{/app/feedback-chat/{id}(id=${feedback.id})}"
                   th:text="'#' + ${feedback.id}">#1</a>
            </td>
            <td th:text="${feedback.dateTime != null ? #temporals.format(feedback.dateTime, 'dd.MM.yyyy HH:mm') : '—'}">—</td>
            <td class="who">
                <div th:text="${feedback.userName != null and !#strings.isEmpty(feedback.userName) ? feedback.userName : feedback.userId}">Пользователь</div>
                <div class="muted" th:text="'ID ' + ${feedback.userId}"></div>
            </td>
            <td class="who">
                <div th:if="${feedback.targetUserId != null}"
                     th:text="${feedback.targetUserName != null and !#strings.isEmpty(feedback.targetUserName)
                             ? feedback.targetUserName
                             : feedback.targetUserId}">Иван</div>
                <div class="muted" th:if="${feedback.targetUserId != null}" th:text="'ID ' + ${feedback.targetUserId}"></div>
                <span class="muted" th:if="${feedback.targetUserId == null}">не указан</span>
            </td>
            <td>
                <span class="status" th:classappend="${feedback.finished != null and feedback.finished} ? 'status-closed' : 'status-open'"
                      th:text="${feedback.finished != null and feedback.finished ? 'Закрыта' : 'Открыта'}">Открыта</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<a class="footer-link" th:href="@{/app/bans}">Все заблокированные →</a>
</body>
</html>
