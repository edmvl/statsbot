<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Результаты квеста</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=12)}" data-back="/app/quests" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 20px 16px 48px;
            margin: 0 auto;
            max-width: 640px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 4px;
            letter-spacing: -0.3px;
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 16px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            background: var(--soft);
            padding: 4px;
            border-radius: var(--radius-pill);
            margin-bottom: 14px;
        }

        .tab {
            flex: 1 1 0;
            padding: 9px 12px;
            border: none;
            border-radius: var(--radius-pill);
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .tab.active {
            background: var(--card-bg);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .person {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 auto;
            background: var(--soft);
            border: 1px solid var(--line);
        }

        .avatar-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--soft);
            color: var(--muted);
            font-size: 18px;
            font-weight: 700;
            border: 1px solid var(--line);
            flex: 0 0 auto;
        }

        .person-main {
            flex: 1 1 auto;
            min-width: 0;
        }

        .person-name {
            font-weight: 600;
            font-size: 15px;
            word-break: break-word;
        }

        .person-meta {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .person-progress {
            flex: 0 0 auto;
            text-align: right;
            font-size: 12px;
            color: var(--muted);
        }

        .person-progress b {
            display: block;
            font-size: 15px;
            color: var(--text);
        }

        .person-progress.done b {
            color: var(--good);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 36px 12px;
        }
    </style>
</head>
<body>
<h1 th:text="'Результаты: ' + ${quest.title}">Результаты</h1>
<p class="sub">
    Начали: <b th:text="${totalStarted}">0</b> ·
    Завершили: <b th:text="${#lists.size(completed)}">0</b> ·
    Чекпоинтов: <b th:text="${checkpointCount}">0</b>
</p>

<div class="tabs">
    <button type="button" class="tab active" data-tab="participants">
        Участники (<span th:text="${#lists.size(participants)}">0</span>)
    </button>
    <button type="button" class="tab" data-tab="completed">
        Завершившие (<span th:text="${#lists.size(completed)}">0</span>)
    </button>
</div>

<div id="tab-participants">
    <div class="empty" th:if="${#lists.isEmpty(participants)}">Пока никто не в процессе.</div>
    <div class="person" th:each="p : ${participants}">
        <img class="avatar" th:if="${p.avatarPath != null and !#strings.isEmpty(p.avatarPath)}"
             th:src="@{/avatar/{id}(id=${p.userId})}" alt=""/>
        <span class="avatar-placeholder" th:unless="${p.avatarPath != null and !#strings.isEmpty(p.avatarPath)}"
              th:text="${p.firstName != null and !#strings.isEmpty(p.firstName) ? #strings.substring(p.firstName,0,1) : '👤'}">👤</span>
        <div class="person-main">
            <div class="person-name"
                 th:text="${p.firstName != null and !#strings.isEmpty(p.firstName)
                          ? (p.firstName + ' ' + (p.lastName != null ? p.lastName : ''))
                          : (!#strings.isEmpty(p.userName) ? '@' + p.userName : 'ID ' + p.userId)}">Имя</div>
            <div class="person-meta" th:text="'ID ' + ${p.userId}"></div>
            <div class="person-meta"
                 th:text="${p.startedAt != null ? 'старт: ' + #temporals.format(p.startedAt, 'dd.MM.yyyy HH:mm') : ''}"></div>
        </div>
        <div class="person-progress">
            <b th:text="${p.passed} + ' / ' + ${checkpointCount}">0 / 0</b>
            чекпоинтов
        </div>
    </div>
</div>

<div id="tab-completed" hidden>
    <div class="empty" th:if="${#lists.isEmpty(completed)}">Пока никто не завершил.</div>
    <div class="person" th:each="p : ${completed}">
        <img class="avatar" th:if="${p.avatarPath != null and !#strings.isEmpty(p.avatarPath)}"
             th:src="@{/avatar/{id}(id=${p.userId})}" alt=""/>
        <span class="avatar-placeholder" th:unless="${p.avatarPath != null and !#strings.isEmpty(p.avatarPath)}"
              th:text="${p.firstName != null and !#strings.isEmpty(p.firstName) ? #strings.substring(p.firstName,0,1) : '👤'}">👤</span>
        <div class="person-main">
            <div class="person-name"
                 th:text="${p.firstName != null and !#strings.isEmpty(p.firstName)
                          ? (p.firstName + ' ' + (p.lastName != null ? p.lastName : ''))
                          : (!#strings.isEmpty(p.userName) ? '@' + p.userName : 'ID ' + p.userId)}">Имя</div>
            <div class="person-meta" th:text="'ID ' + ${p.userId}"></div>
            <div class="person-meta"
                 th:text="${p.finishedAt != null ? 'финиш: ' + #temporals.format(p.finishedAt, 'dd.MM.yyyy HH:mm') : ''}"></div>
        </div>
        <div class="person-progress done">
            <b>✅</b>
            <span th:text="${#temporals.format(p.startedAt, 'dd.MM HH:mm')} + ' → ' + ${#temporals.format(p.finishedAt, 'dd.MM HH:mm')}"></span>
        </div>
    </div>
</div>

<script>
    (function () {
        var tabs = document.querySelectorAll('.tab');
        tabs.forEach(function (tab) {
            tab.addEventListener('click', function () {
                tabs.forEach(function (other) {
                    other.classList.remove('active');
                });
                tab.classList.add('active');
                ['participants', 'completed'].forEach(function (name) {
                    var panel = document.getElementById('tab-' + name);
                    if (panel) {
                        panel.hidden = name !== tab.getAttribute('data-tab');
                    }
                });
            });
        });
    })();
</script>
</body>
</html>
