<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=9)}" data-back="/app" defer></script>
    <title>Отзывы о поездках</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 20px 16px 56px;
            max-width: 780px;
            margin: 0 auto;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- Заголовок ----- */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .page-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }
        .page-header .trip-count {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: var(--soft);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
        }

        /* ----- Поиск ----- */
        .search-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            padding: 10px 12px;
            margin-bottom: 18px;
        }
        .search-field {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 110px;
            min-width: 0;
        }
        .search-field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .search-field input {
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            height: 36px;
            padding: 0 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--page-bg);
            border: 1px solid var(--line);
            border-radius: 9px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .search-field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--soft);
        }
        .search-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            margin-left: auto;
        }
        .btn-search,
        .btn-reset {
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            text-decoration: none;
            transition: background var(--transition);
        }
        .btn-search {
            border: none;
            background: var(--accent);
            color: var(--on-accent);
            cursor: pointer;
        }
        .btn-search:hover {
            filter: brightness(0.92);
        }
        .btn-reset {
            background: var(--soft);
            color: var(--text);
        }
        .btn-reset:hover {
            background: var(--soft-strong);
        }

        /* ----- Карточка публикации ----- */
        .trip-card {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
            transition: box-shadow var(--transition), transform var(--transition);
        }
        .trip-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .trip-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            margin-bottom: 14px;
        }

        .trip-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 auto;
            border: 1px solid var(--line);
            background: var(--soft);
        }
        .trip-avatar-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--soft);
            color: var(--muted);
            font-size: 19px;
            font-weight: 600;
            border: 1px solid var(--line);
            flex: 0 0 auto;
        }

        .user-name-label {
            display: inline-flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
        }
        .user-name-label .last-name {
            font-weight: 400;
        }
        .user-name-label .username {
            font-weight: 500;
            font-size: 13px;
            color: var(--accent);
            background: var(--soft);
            padding: 2px 9px;
            border-radius: var(--radius-pill);
        }
        .user-name-label:hover .username,
        .user-name-label:hover .last-name {
            text-decoration: underline;
        }

        .trip-badges {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            background: var(--soft);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            white-space: nowrap;
        }
        .chip b {
            color: var(--text);
            font-weight: 700;
        }

        .rating-badge {
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
            font-size: 14px;
            font-weight: 500;
            background: var(--soft);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            white-space: nowrap;
        }
        .rating-badge .rating-value {
            font-weight: 700;
            font-size: 16px;
        }
        .rating-badge .star {
            color: var(--star);
        }
        .rating-value.good { color: var(--good); }
        .rating-value.mid  { color: var(--mid); }
        .rating-value.low  { color: var(--low); }
        .no-rating-label {
            font-size: 13px;
            color: var(--muted);
        }

        .trip-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .trip-meta {
            font-size: 13px;
            color: var(--muted);
            border-bottom: 1px dashed var(--line);
            padding-bottom: 12px;
        }
        .trip-meta .date-text {
            font-weight: 500;
        }

        /* Текст публикации — «сообщение» пользователя: мягкая заливка в тон акцента
           и скруглённый уголок, чтобы отличалось от блока отзывов ниже. */
        .message-text {
            background: var(--soft);
            background: color-mix(in srgb, var(--accent) 10%, transparent);
            border-radius: 6px 16px 16px 16px;
            padding: 14px 16px;
            font-size: 15.5px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 0 0 1px var(--line-soft);
        }

        /* Отзывы — вторичный блок: подпись и цитата с тонкой линией слева. */
        .comments-section {
            margin-top: 4px;
        }
        .comments-section .comments-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .comments-section .comments-text {
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            padding-left: 14px;
            border-left: 2px solid var(--line-soft);
        }
        .comments-section .no-comments {
            font-style: italic;
            font-size: 13px;
            color: var(--muted);
        }

        .trip-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--line-soft);
        }

        /* ----- Тумблер подписки ----- */
        .subscribe-toggle {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            user-select: none;
        }
        .subscribe-toggle input {
            display: none;
        }
        .subscribe-toggle .switch {
            position: relative;
            flex: 0 0 auto;
            width: 42px;
            height: 24px;
            border-radius: var(--radius-pill);
            background: var(--line);
            transition: background var(--transition);
        }
        .subscribe-toggle .switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(15, 33, 55, 0.25);
            transition: transform var(--transition);
        }
        .subscribe-toggle input:checked + .switch {
            background: var(--accent);
        }
        .subscribe-toggle input:checked + .switch::after {
            transform: translateX(18px);
        }
        .subscribe-toggle .subscribe-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            white-space: nowrap;
        }
        .subscribe-toggle input:checked ~ .subscribe-label {
            color: var(--accent);
        }
        .subscribe-toggle.disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-feedback {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.28);
            transition: background var(--transition), transform var(--transition);
        }
        .btn-feedback:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }
        .btn-feedback:active {
            transform: scale(0.98);
        }

        .own-post-label {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            border: 1px dashed var(--line);
            border-radius: var(--radius-pill);
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        /* ----- Пагинация ----- */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .pagination a {
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            padding: 9px 18px;
            border-radius: var(--radius-pill);
            transition: background var(--transition), color var(--transition);
        }
        .pagination a:hover {
            background: var(--accent);
            color: var(--on-accent);
        }
        .pagination .current-page {
            font-weight: 700;
            font-size: 16px;
            color: var(--muted);
            padding: 0 6px;
        }

        /* ----- Модальное окно ----- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1100;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(9, 22, 38, 0.45);
            backdrop-filter: blur(3px);
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            color: var(--text);
            border-radius: var(--radius-lg);
            max-width: 460px;
            width: 100%;
            padding: 26px 24px 24px;
            box-shadow: 0 26px 60px rgba(9, 22, 38, 0.30);
            animation: modalFade 0.18s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
        }
        .close {
            font-size: 30px;
            line-height: 1;
            color: var(--muted);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0 4px;
            transition: color var(--transition);
        }
        .close:hover {
            color: var(--low);
        }

        .modal label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin: 16px 0 8px;
        }
        .modal label:first-of-type {
            margin-top: 0;
        }

        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
        }
        .stars input {
            display: none;
        }
        .stars label {
            font-size: 36px;
            line-height: 1;
            margin: 0;
            cursor: pointer;
            color: var(--line);
            transition: color 0.15s, transform 0.1s;
        }
        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: var(--star);
        }
        .stars label:hover {
            transform: scale(1.06);
        }

        .modal textarea {
            width: 100%;
            border-radius: var(--radius-md);
            border: 1px solid var(--line);
            background: var(--page-bg);
            color: var(--text);
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--soft);
        }

        .btn-submit {
            width: 100%;
            margin-top: 22px;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.28);
            transition: background var(--transition), transform var(--transition);
        }
        .btn-submit:hover {
            filter: brightness(0.92);
        }
        .btn-submit:active {
            transform: scale(0.99);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 32px 12px;
        }

        .alert-error {
            margin: 0 0 14px;
            padding: 12px 14px;
            border: 1px solid rgba(229, 72, 77, 0.35);
            border-radius: var(--radius-md);
            background: rgba(229, 72, 77, 0.12);
            color: var(--low);
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 44px; }
            .page-header h1 { font-size: 22px; }
            .trip-card { padding: 16px; }
            .user-name-label { font-size: 17px; }
            .trip-badges { margin-left: 0; }
            .trip-actions { justify-content: stretch; }
            .btn-feedback { width: 100%; justify-content: center; }
            .search-field { flex: 1 1 44%; }
            .search-actions { margin-left: 0; width: 100%; }
            .btn-search, .btn-reset { flex: 1 1 0; }
            .modal-content { padding: 22px 18px; }
            .stars label { font-size: 32px; }
        }
    </style>
</head>
<body>

<!-- Заголовок -->
<div class="page-header">
    <h1>🚐 Отзывы о поездках</h1>
    <span class="trip-count" th:text="'Найдено: ' + ${#lists.size(tripList)}">Найдено: 0</span>
</div>

<div class="alert-error" th:if="${reviewError}" th:text="${reviewError}"></div>

<!-- Поиск -->
<form class="search-panel" method="get" th:action="@{/app/trips}">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="count" th:value="${count}"/>

    <div class="search-field">
        <label for="dateFrom">С</label>
        <input type="date" id="dateFrom" name="dateFrom" th:value="${dateFrom}"/>
    </div>
    <div class="search-field">
        <label for="dateTo">По</label>
        <input type="date" id="dateTo" name="dateTo" th:value="${dateTo}"/>
    </div>
    <div class="search-field">
        <input type="text" id="author" name="author" th:value="${author}"
               placeholder="Имя или @ник" aria-label="Автор"/>
    </div>
    <div class="search-field">
        <input type="text" id="text" name="text" th:value="${text}"
               placeholder="Текст" aria-label="Текст публикации"/>
    </div>

    <div class="search-actions">
        <button class="btn-search" type="submit">Найти</button>
        <a class="btn-reset" th:href="@{/app/trips}">Сбросить</a>
    </div>
</form>

<div th:if="${#lists.isEmpty(tripList)}" class="empty">Ничего не найдено</div>

<!-- Список карточек -->
<div th:each="trip : ${tripList}" class="trip-card">

    <!-- Верхняя часть: пользователь + сообщения + рейтинг -->
    <div class="trip-header">
        <img class="trip-avatar" th:if="${trip.avatarPath}"
             th:src="@{/avatar/{id}(id=${trip.userId})}" alt=""/>
        <span class="trip-avatar-placeholder" th:unless="${trip.avatarPath}"
              th:text="${#strings.isEmpty(trip.firstName) ? '👤' : #strings.substring(trip.firstName,0,1)}">👤</span>

        <a class="user-name-label" th:href="@{/app/reviews/{id}(id=${trip.userId})}"
           title="Отзывы и история данных пользователя">
            <span th:text="${trip.firstName}">Имя</span>
            <span class="last-name" th:text="${trip.lastName}">Фамилия</span>
            <span class="username" th:if="${trip.userName}" th:text="'@' + ${trip.userName}"></span>
        </a>

        <div class="trip-badges">
            <span class="chip" title="Сколько сообщений этот пользователь написал в чате">
                💬 Сообщений: <b th:text="${trip.cnt}">0</b>
            </span>
            <span class="rating-badge" title="Средняя оценка по отзывам">
                <span th:if="${trip.rating}">
                    <span class="rating-value"
                          th:classappend="${trip.rating >= 4} ? 'good' : (${trip.rating >= 3} ? 'mid' : 'low')"
                          th:text="${trip.rating}">4.5</span><span class="star">★</span>
                </span>
                <span th:unless="${trip.rating}" class="no-rating-label">Нет оценок</span>
            </span>
        </div>
    </div>

    <!-- Тело поездки -->
    <div class="trip-body">
        <div class="trip-meta">
            <span class="date-text"
                  th:text="${trip.dateTime != null ? #temporals.format(trip.dateTime, 'd MMMM yyyy, HH:mm', ruLocale) : ''}">15 октября 2026, 14:30</span>
        </div>

        <div class="message-text" th:text="${trip.text}">
            Текст сообщения о поездке, впечатления, маршрут.
        </div>

        <!-- Комментарии / отзывы -->
        <div class="comments-section">
            <div class="comments-label">💬 Отзывы</div>
            <div th:if="${trip.comments}" class="comments-text" th:text="${trip.comments}">
                Комментарий: отличный попутчик, всё понравилось!
            </div>
            <div th:unless="${trip.comments}" class="no-comments">
                Пока нет отзывов
            </div>
        </div>
    </div>

    <!-- Действия: подписка на автора + отзыв -->
    <div class="trip-actions">
        <label class="subscribe-toggle"
               th:if="${trip.userId}"
               th:attr="data-interest-id=${trip.userId}"
               title="Уведомлять о новых публикациях автора">
            <input type="checkbox"
                   class="interest-checkbox"
                   th:attr="data-interest-id=${trip.userId}"
                   disabled
                   onchange="onSubscribeChange(this)"/>
            <span class="switch"></span>
            <span class="subscribe-label">Подписаться</span>
        </label>
        <button class="btn-feedback"
                th:if="${trip.userId != currentUserId}"
                th:data-user-id="${trip.userId}"
                onclick="openModal(this.getAttribute('data-user-id'))">
            ✍️ Оставить отзыв
        </button>
        <span class="own-post-label" th:if="${trip.userId == currentUserId}">Это ваш отзыв</span>
    </div>
</div>

<!-- Пагинация -->
<div class="pagination">
    <a th:href="@{/app/trips(page=${prevPage}, count=${count}, dateFrom=${dateFrom}, dateTo=${dateTo}, author=${author}, text=${text})}" th:text="'‹ Назад'" th:unless="${prevPage == null}">‹ Назад</a>
    <span class="current-page" th:text="${currentPage}">1</span>
    <a th:href="@{/app/trips(page=${nextPage}, count=${count}, dateFrom=${dateFrom}, dateTo=${dateTo}, author=${author}, text=${text})}" th:text="'Вперед ›'" th:unless="${nextPage == null}">Вперед ›</a>
</div>

<!-- ====== Модальное окно ====== -->
<div id="reviewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ Ваш отзыв</h3>
            <button class="close" onclick="closeModal()">&times;</button>
        </div>

        <form method="post" th:action="@{/app/trips}">
            <!-- Кого оцениваем; автора отзыва сервер берёт из подписанного initData. -->
            <input type="hidden" id="userId" name="userId"/>

            <label>⭐ Оценка</label>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5">
                <label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4">
                <label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3">
                <label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2">
                <label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1">
                <label for="star1">★</label>
            </div>

            <label for="commentText">💬 Комментарий</label>
            <textarea id="commentText" name="comment" rows="4" placeholder="Поделитесь впечатлениями о поездке..."></textarea>

            <button class="btn-submit" type="submit">Отправить отзыв</button>
        </form>
    </div>
</div>

<script>
    function openModal(userId) {
        document.getElementById("userId").value = userId;
        const modal = document.getElementById("reviewModal");
        modal.classList.add('show');
        modal.style.display = 'flex';
    }

    function closeModal() {
        const modal = document.getElementById("reviewModal");
        modal.classList.remove('show');
        modal.style.display = 'none';
    }

    window.onclick = function (event) {
        const modal = document.getElementById("reviewModal");
        if (event.target === modal) {
            closeModal();
        }
    };

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById("reviewModal");
            if (modal.classList.contains('show')) {
                closeModal();
            }
        }
    });

    // ===== Подписка на автора публикации =====

    // Telegram id того, кто открыл страницу — именно он записывается в interested.user_id.
    function getTelegramUserId() {
        if (typeof Telegram !== 'undefined'
            && Telegram.WebApp
            && Telegram.WebApp.initDataUnsafe
            && Telegram.WebApp.initDataUnsafe.user
            && Telegram.WebApp.initDataUnsafe.user.id) {
            return String(Telegram.WebApp.initDataUnsafe.user.id);
        }
        return null;
    }

    function interestCheckboxes(interestId) {
        return document.querySelectorAll('.interest-checkbox[data-interest-id="' + interestId + '"]');
    }

    function setInterestState(interestId, subscribed) {
        interestCheckboxes(interestId).forEach(function (checkbox) {
            checkbox.checked = subscribed;
        });
    }

    function setInterestDisabled(interestId, disabled) {
        interestCheckboxes(interestId).forEach(function (checkbox) {
            checkbox.disabled = disabled;
        });
    }

    function onSubscribeChange(checkbox) {
        const interestId = checkbox.getAttribute('data-interest-id');
        const subscribed = checkbox.checked;
        if (!getTelegramUserId()) {
            // Нет Telegram id — подписка невозможна, возвращаем переключатель назад.
            setInterestState(interestId, !subscribed);
            return;
        }
        // Синхронизируем все переключатели этого автора (у него может быть несколько публикаций).
        setInterestState(interestId, subscribed);
        setInterestDisabled(interestId, true);

        // Пользователя сервер определяет по подписанному initData (cookie).
        const params = new URLSearchParams();
        params.set('interestId', interestId);
        params.set('subscribed', subscribed);

        fetch('/app/interested', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
            body: params.toString()
        }).then(function (response) {
            if (!response.ok) {
                throw new Error('request failed');
            }
        }).catch(function () {
            // При ошибке откатываем состояние.
            setInterestState(interestId, !subscribed);
        }).finally(function () {
            setInterestDisabled(interestId, false);
        });
    }

    function initSubscriptions() {
        const checkboxes = document.querySelectorAll('.interest-checkbox');
        if (!checkboxes.length) {
            return;
        }
        const userId = getTelegramUserId();
        if (!userId) {
            document.querySelectorAll('.subscribe-toggle').forEach(function (toggle) {
                toggle.classList.add('disabled');
            });
            return;
        }
        fetch('/app/interested')
            .then(function (response) {
                return response.ok ? response.json() : [];
            })
            .then(function (ids) {
                const subscribed = new Set(Array.isArray(ids) ? ids : []);
                checkboxes.forEach(function (checkbox) {
                    checkbox.checked = subscribed.has(checkbox.getAttribute('data-interest-id'));
                    checkbox.disabled = false;
                });
            })
            .catch(function () {
                checkboxes.forEach(function (checkbox) {
                    checkbox.disabled = false;
                });
            });
    }

    // telegram-web-app.js подключён с defer, поэтому Telegram появляется только
    // после разбора документа — инициализируем подписки после DOMContentLoaded.
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSubscriptions);
    } else {
        initSubscriptions();
    }
</script>

</body>
</html>
