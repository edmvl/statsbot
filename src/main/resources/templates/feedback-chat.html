<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Обращение</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=12)}" data-back="/app/feedback" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 20px 16px 48px;
            margin: 0 auto;
            max-width: 640px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .head {
            margin-bottom: 16px;
        }

        .head h1 {
            font-size: 22px;
            margin: 0 0 6px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .head .num {
            color: var(--muted);
            font-size: 15px;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
        }

        .status-open {
            background: rgba(245, 158, 11, 0.18);
            color: #c98a00;
        }

        .status-closed {
            background: rgba(46, 158, 91, 0.18);
            color: var(--good);
        }

        .sub {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        .target {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .target .muted {
            color: var(--muted);
            font-size: 13px;
            margin-left: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .description {
            margin: 0;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .gallery-item {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 4px;
            text-align: center;
            background: var(--inner-bg);
        }

        .gallery-item img {
            max-width: 100%;
            border-radius: 6px;
            object-fit: cover;
        }

        .closed-box {
            background: rgba(46, 158, 91, 0.10);
            border: 1px solid rgba(46, 158, 91, 0.30);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 14px;
        }

        .closed-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--good);
            margin-bottom: 4px;
        }

        .closed-reason {
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .reopen-btn {
            margin-top: 10px;
            padding: 9px 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius-pill);
            background: var(--inner-bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .reopen-btn:hover {
            background: var(--soft);
        }

        .ban-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .banned {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            background: rgba(229, 72, 77, 0.14);
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
        }

        .ban-btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--danger);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .ban-btn:hover {
            filter: brightness(0.92);
        }

        h2 {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin: 0 0 10px;
        }

        .reply {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .reply-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }

        .reply-author {
            font-weight: 600;
            font-size: 14px;
            word-break: break-word;
        }

        .reply-head time {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .reply-text {
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .reply .gallery {
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            margin-top: 10px;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
        }

        .reply-form, .close-form {
            margin: 20px 0;
        }

        .reply-form label, .close-form label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--inner-bg);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border: 1px dashed var(--line);
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            background: var(--inner-bg);
        }

        .file-names {
            font-size: 13px;
            color: var(--muted);
        }

        .submit-btn {
            margin-top: 12px;
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .close-btn {
            margin-top: 10px;
            padding: 11px 20px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--soft-strong);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .link {
            color: var(--link);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header class="head">
    <h1>
        Обращение <span class="num" th:text="'#' + ${feedback.id}">#1</span>
        <span class="status"
              th:classappend="${feedback.finished != null and feedback.finished} ? 'status-closed' : 'status-open'"
              th:text="${feedback.finished != null and feedback.finished ? 'Закрыта' : 'Открыта'}">Открыта</span>
    </h1>
    <p class="sub" th:text="'От: ' + ${feedback.userName}">От: Пользователь</p>
    <p class="target" th:if="${feedback.targetUserId != null}">
        На пользователя:
        <b th:text="${feedback.targetUserName != null and !#strings.isEmpty(feedback.targetUserName)
                     ? feedback.targetUserName
                     : feedback.targetUserId}">Иван</b>
        <span class="muted" th:text="'ID ' + ${feedback.targetUserId}"></span>
    </p>
</header>

<section class="card">
    <p class="description" th:text="${feedback.description}">Текст жалобы</p>
    <div class="gallery" th:if="${!#lists.isEmpty(files)}">
        <div class="gallery-item" th:each="file : ${files}">
            <img th:src="@{/images(name=${file}, id=${feedback.id})}" alt=""/>
        </div>
    </div>
</section>

<!-- Жалоба закрыта: причина и возможность переоткрыть (автору) -->
<div class="closed-box" th:if="${feedback.finished != null and feedback.finished}">
    <div class="closed-title">Жалоба закрыта</div>
    <div class="closed-reason"
         th:text="${feedback.closeReason != null and !#strings.isEmpty(feedback.closeReason)
                  ? feedback.closeReason
                  : 'Причина не указана'}">Причина</div>
    <form method="post" th:if="${isOwner != null and isOwner}"
          th:action="@{/app/feedback-chat/{id}/reopen(id=${feedback.id})}"
          onsubmit="return confirm('Переоткрыть жалобу?');">
        <button type="submit" class="reopen-btn">Переоткрыть жалобу</button>
    </form>
</div>

<!-- Блокировка (только админам и только если указан пользователь) -->
<div class="ban-row" th:if="${isAdmin != null and isAdmin and feedback.targetUserId != null}">
    <span class="banned" th:if="${banned}">🚫 Заблокирован по этому обращению</span>
    <form method="post" th:unless="${banned}"
          th:action="@{/app/feedback-chat/{id}/ban(id=${feedback.id})}"
          onsubmit="return confirm('Заблокировать пользователя в чате поездок?');">
        <button type="submit" class="ban-btn">🚫 Заблокировать</button>
    </form>
</div>

<h2>Переписка</h2>

<div class="reply" th:each="reply : ${feedBackChatList}">
    <div class="reply-head">
        <span class="reply-author" th:text="${reply.userName}">Админ</span>
        <time th:text="${reply.dateTime != null ? #temporals.format(reply.dateTime, 'dd.MM.yyyy HH:mm') : ''}"></time>
    </div>
    <div class="reply-text" th:text="${reply.description}">Ответ</div>
    <div class="gallery" th:if="${commentFiles != null and !#lists.isEmpty(commentFiles[reply.id])}">
        <div class="gallery-item" th:each="file : ${commentFiles[reply.id]}">
            <img th:src="@{/images(name=${file}, id=${'fc-' + reply.id})}" alt=""/>
        </div>
    </div>
</div>
<p class="muted" th:if="${#lists.isEmpty(feedBackChatList)}">Комментариев пока нет</p>

<!-- Комментарий (админ отвечает, автор дополняет жалобу) -->
<form class="reply-form" method="post" enctype="multipart/form-data" th:action="@{/app/feedback-chat}">
    <input type="hidden" name="id" th:value="${feedback.id}">
    <label for="replyText">Комментарий</label>
    <textarea id="replyText" name="text" required></textarea>
    <div class="file-row">
        <label class="file-label" for="replyFiles">📎 Прикрепить файлы</label>
        <input class="file-input" type="file" id="replyFiles" name="files" multiple
               accept=".jpg,.jpeg,.png,.gif" onchange="showFileNames(this)"/>
        <span class="file-names" id="fileNames"></span>
    </div>
    <button type="submit" class="submit-btn">Отправить</button>
</form>

<!-- Закрыть с причиной отказа (только админ и только открытую) -->
<form class="close-form" th:if="${isAdmin != null and isAdmin and (feedback.finished == null or !feedback.finished)}"
      method="post" th:action="@{/app/feedback-chat/{id}/close(id=${feedback.id})}"
      onsubmit="return confirm('Закрыть жалобу с отказом? Автору уйдёт сообщение с причиной.');">
    <label for="closeReason">Отклонить жалобу — причина</label>
    <textarea id="closeReason" name="reason" required
              placeholder="Например: недостаточно доказательств"></textarea>
    <button type="submit" class="close-btn">Закрыть жалобу</button>
</form>

<div class="links" th:if="${isAdmin != null and isAdmin}">
    <a class="link" th:href="@{/app/feedback-list}">Все жалобы →</a>
    <a class="link" th:href="@{/app/bans}">Все заблокированные →</a>
</div>

<script>
    function showFileNames(input) {
        var names = [];
        for (var i = 0; i < input.files.length; i++) {
            names.push(input.files[i].name);
        }
        document.getElementById('fileNames').textContent = names.join(', ');
    }
</script>
</body>
</html>
