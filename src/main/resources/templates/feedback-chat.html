<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Обращение</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=12)}" data-back="/app/feedback" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 20px 16px 48px;
            margin: 0 auto;
            max-width: 640px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .head {
            margin-bottom: 16px;
        }

        .head h1 {
            font-size: 22px;
            margin: 0 0 4px;
            letter-spacing: -0.3px;
        }

        .head .num {
            color: var(--muted);
            font-size: 15px;
            font-weight: 600;
        }

        .sub {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        .target {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .target .muted {
            color: var(--muted);
            font-size: 13px;
            margin-left: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .description {
            margin: 0;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .gallery-item {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 4px;
            text-align: center;
            background: var(--inner-bg);
        }

        .gallery-item img {
            max-width: 100%;
            border-radius: 6px;
            object-fit: cover;
        }

        .ban-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .banned {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            background: rgba(229, 72, 77, 0.14);
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
        }

        .ban-btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--danger);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .ban-btn:hover {
            filter: brightness(0.92);
        }

        h2 {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin: 0 0 10px;
        }

        .reply {
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .reply-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }

        .reply-author {
            font-weight: 600;
            font-size: 14px;
        }

        .reply-head time {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .reply-text {
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
        }

        .reply-form {
            margin: 20px 0;
        }

        .reply-form label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--inner-bg);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            margin-top: 12px;
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .link {
            display: inline-block;
            margin-top: 4px;
            color: var(--link);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header class="head">
    <h1>Обращение <span class="num" th:text="'#' + ${feedback.id}">#1</span></h1>
    <p class="sub" th:text="'От: ' + ${feedback.userName}">От: Пользователь</p>
    <p class="target" th:if="${feedback.targetUserId != null}">
        На пользователя:
        <b th:text="${feedback.targetUserName != null and !#strings.isEmpty(feedback.targetUserName)
                     ? feedback.targetUserName
                     : feedback.targetUserId}">Иван</b>
        <span class="muted" th:text="'ID ' + ${feedback.targetUserId}"></span>
    </p>
</header>

<section class="card">
    <p class="description" th:text="${feedback.description}">Текст жалобы</p>
    <div class="gallery" th:if="${!#lists.isEmpty(files)}">
        <div class="gallery-item" th:each="file : ${files}">
            <img th:src="@{/images(name=${file}, id=${feedback.id})}" alt=""/>
        </div>
    </div>
</section>

<div class="ban-row" th:if="${feedback.targetUserId != null}">
    <span class="banned" th:if="${banned}">🚫 Заблокирован по этому обращению</span>
    <form method="post" th:unless="${banned}"
          th:action="@{/app/feedback-chat/{id}/ban(id=${feedback.id})}"
          onsubmit="return confirm('Заблокировать пользователя в чате поездок?');">
        <button type="submit" class="ban-btn">🚫 Заблокировать</button>
    </form>
</div>

<h2>Переписка</h2>

<div class="reply" th:each="reply : ${feedBackChatList}">
    <div class="reply-head">
        <span class="reply-author" th:text="${reply.userName}">Админ</span>
        <time th:text="${reply.dateTime != null ? #temporals.format(reply.dateTime, 'dd.MM.yyyy HH:mm') : ''}"></time>
    </div>
    <div class="reply-text" th:text="${reply.description}">Ответ</div>
</div>
<p class="muted" th:if="${#lists.isEmpty(feedBackChatList)}">Ответов пока нет</p>

<form class="reply-form" method="post" th:action="@{/app/feedback-chat}">
    <label for="reply">Ответ</label>
    <input type="hidden" name="id" th:value="${feedback.id}">
    <textarea id="reply" name="text" required></textarea>
    <button type="submit" class="submit-btn">Ответить</button>
</form>

<a class="link" th:href="@{/app/feedback-list}">Все жалобы →</a>
&nbsp;
<a class="link" th:href="@{/app/bans}">Все заблокированные →</a>
</body>
</html>
