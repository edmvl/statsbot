<!DOCTYPE html>
<html lang="en">
<head>
    <title>Обращение</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=11)}" data-back="/app/feedback" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 16px;
            margin: 0;
        }

        label, input {
            display: block;
        }

        fieldset {
            padding: 0;
            border: 0;
            margin-top: 25px;
        }

        h1 {
            font-size: 1.2em;
            margin: .6em 0;
        }

        #users-contain {
            max-width: 640px;
            margin: 20px 0;
        }

        #users {
            width: 100%;
            margin: 1em 0;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        #users td, #users th {
            border-bottom: 1px solid var(--line-soft);
            padding: .6em 10px;
            text-align: left;
            color: var(--text);
            vertical-align: top;
        }

        #users tr:last-child td {
            border-bottom: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .gallery-item {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 5px;
            text-align: center;
            background: var(--card-bg);
        }

        .gallery-item img {
            max-width: 100%;
            object-fit: cover;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--inner-bg);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            margin-top: 12px;
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

    </style>
</head>
<body>
<div id="users-contain">
    <span>Жалоба</span>
    <span th:text="${feedback.getUserName()}"></span>
    <div class="gallery">
        <div class="gallery-item" th:each="file : ${files}">
            <img th:src="@{/images(name=${file}, id=${feedback.getId()})}"/>
        </div>
        <div>
            <p th:text="${feedback.getDescription()}"></p>
        </div>
    </div>
    <table id="users">
        <tr th:each="feedBackChat : ${feedBackChatList}">
            <td th:text="${feedBackChat.dateTime != null ? #temporals.format(feedBackChat.dateTime, 'dd.MM.yyyy HH:mm') : ''}"></td>
            <td th:text="${feedBackChat.userName}"></td>
            <td th:text="${feedBackChat.description}"></td>
        </tr>
    </table>
</div>
<div class="form-group">
    <form method="post" th:action="@{/app/feedback-chat}">
        <label for="reply">Ответ</label>
        <input type="hidden" name="id" th:value="${feedback.getId()}">
        <textarea
                id="reply"
                name="text"
                required
        ></textarea>
        <button type="submit" class="submit-btn" id="submitBtn">
            Ответить
        </button>
    </form>
</div>
</body>
</html>
