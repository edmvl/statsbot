<!DOCTYPE html>
<html lang="en">
<head>
    <title>Логи чата</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" th:href="@{/webjars/jquery-ui/1.13.3/jquery-ui.min.css}">
    <script th:src="@{/webjars/jquery/3.6.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/jquery-ui/1.13.3/jquery-ui.min.js}"></script>
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=9)}" data-back="/app/feedback" defer></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff !important;
            --tg-theme-text-color: #000000 !important;
            --tg-theme-hint-color: #999999 !important;
            --tg-theme-link-color: #2481cc !important;
            --tg-theme-button-color: #2481cc !important;
            --tg-theme-button-text-color: #ffffff !important;
            --tg-theme-secondary-bg-color: #f1f1f1 !important;
        }

        /* Принудительное применение для всех элементов */
        body {
            background-color: var(--tg-theme-bg-color) !important;
            color: var(--tg-theme-text-color) !important;
        }

        /* Альтернативный подход - прямые значения */
        body.force-light-theme {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        body {
            font-family: Arial, sans-serif;
        }

        label, input {
            display: block;
        }

        fieldset {
            padding: 0;
            border: 0;
            margin-top: 25px;
        }

        h1 {
            font-size: 1.2em;
            margin: .6em 0;
        }

        div#users-contain {
            width: 350px;
            margin: 20px 0;
        }

        div#users-contain table {
            margin: 1em 0;
            border-collapse: collapse;
            width: 100%;
        }

        div#users-contain table td, div#users-contain table th {
            border: 1px solid #eee;
            padding: .6em 10px;
            text-align: left;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .gallery-item {
            border: 1px solid #ccc;
            padding: 5px;
            text-align: center;
        }

        .gallery-item img {
            max-width: 100%;
            max-height: 2622px;
            object-fit: cover;
        }

        textarea:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #2481cc);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #999999);
            border-radius: 12px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }

    </style>
</head>
<body>
<div id="users-contain" class="ui-widget">
    <span>Жалоба</span>
    <span th:text="${feedback.getUserName()}"></span>
    <div class="gallery">
        <div class="gallery-item" th:each="file : ${files}">
            <img th:src="@{/images(name=${file}, id=${feedback.getId()})}"/>
        </div>
        <div>
            <p th:text="${feedback.getDescription()}"></p>
        </div>
    </div>
    <table id="users" class="ui-widget ui-widget-content">
        <tr th:each="feedBackChat : ${feedBackChatList}">
            <td th:text="${{feedBackChat.getDateTime()}}"></td>
            <td th:text="${{feedBackChat.getUserName()}}"></td>
            <td th:text="${{feedBackChat.getDescription()}}"></td>
        </tr>
    </table>
</div>
<div class="form-group">
    <form method="post" th:action="@{/app/feedback-chat}">
        <label for="reply">Ответ</label>
        <input type="hidden" name="id" th:value="${feedback.getId()}">
        <textarea
                id="reply"
                name="text"
                required
        ></textarea>
        <button type="submit" class="submit-btn" id="submitBtn">
            Ответить
        </button>
    </form>
</div>
</body>
</html>
