<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius-lg);
            padding: 32px 24px 28px;
            box-shadow: var(--shadow);
        }

        .code {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            height: 64px;
            padding: 0 16px;
            margin-bottom: 16px;
            border-radius: var(--radius-pill);
            background: var(--soft);
            color: var(--muted);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 21px;
            margin: 0 0 8px;
            letter-spacing: -0.2px;
        }

        .hint {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--on-accent);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn:hover {
            filter: brightness(0.92);
        }
    </style>
</head>
<body>
<main class="card" th:with="code=${status != null ? status : 500}">
    <div class="code" th:text="${code}">500</div>
    <h1 th:text="${code == 403 ? 'Нет доступа'
                    : (code == 404 ? 'Страница не найдена'
                    : 'Что-то пошло не так')}">Ошибка</h1>
    <p class="hint" th:text="${code == 403 ? 'Эта страница доступна только администраторам бота.'
                    : (code == 404 ? 'Такой страницы нет или она была удалена.'
                    : 'Попробуйте обновить страницу чуть позже.')}">Пояснение</p>
    <a class="btn" href="/app">На главную</a>
</main>
</body>
</html>
