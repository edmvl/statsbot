<!DOCTYPE html>
<html lang="en">
<head>
    <title>Логи чата</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/telegram-web-app.js}" defer></script>
    <script th:src="@{/js/app-back.js(v=10)}" data-back="/app/chats" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            padding: 16px;
            margin: 0;
        }

        label, input {
            display: block;
        }

        fieldset {
            padding: 0;
            border: 0;
            margin-top: 25px;
        }

        h1 {
            font-size: 1.2em;
            margin: .6em 0;
        }

        #users-contain {
            max-width: 480px;
            margin: 20px 0;
        }

        #users {
            width: 100%;
            margin: 1em 0;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        #users td, #users th {
            border-bottom: 1px solid var(--line-soft);
            padding: .6em 10px;
            text-align: left;
            color: var(--text);
            vertical-align: top;
        }

        #users tr:last-child td {
            border-bottom: none;
        }

        .pager {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
        }

        .pager a {
            color: var(--link);
            text-decoration: none;
            font-weight: 600;
        }

        .pager .current {
            color: var(--muted);
        }

    </style>
</head>
<body>
<div id="users-contain">
    <h1 th:text="${chatName}"></h1>
    <table id="users">
        <tr th:each="message : ${messages}">
            <td th:text="${{message.getDateTime()}}"></td>
            <td>
                <div th:text="${{message.getFirstName()}}"></div>
                <div th:text="${{message.getLastName()}}"></div>
                <div th:if="${{message.getUserName()}}">
                    (<span th:text="${{message.getUserName()}}"></span>)
                </div>
            </td>
            <td th:text="${{message.getText()}}"></td>
        </tr>
    </table>
</div>
<div class="pager">
    <a th:href="@{/app/chat/{chatId}(page=${prevPage}, count=${count}, chatId=${chatId})}" th:text="${prevPage}"></a>
    <span class="current" th:text="${currentPage}"></span>
    <a th:href="@{/app/chat/{chatId}(page=${nextPage}, count=${count}, chatId=${chatId})}" th:text="${nextPage}"></a>
</div>
</body>
</html>
