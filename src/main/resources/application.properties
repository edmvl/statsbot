# ВНИМАНИЕ: секреты в репозитории не хранятся.
#
# Окружение выбирается профилем Spring: локальный (local) или боевой (prod).
# Реальные значения лежат в config/application-local.properties и
# config/application-prod.properties (папка config/ в .gitignore).
# Шаблоны без секретов — application-local.example.properties / application-prod.example.properties.
#
# Профиль по умолчанию — local. На сервере переопределяется переменной окружения
# SPRING_PROFILES_ACTIVE=prod (env имеет приоритет над этим файлом).
spring.profiles.active=local

# Значения ниже — запасные, если профильный файл не найден. По умолчанию подходят
# только для локальной разработки.

telegram.bot.username=${TELEGRAM_BOT_USERNAME:hamoryalstatsbot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tgbot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Flyway: существующую схему (из дампа) помечаем baseline'ом и применяем миграции выше неё.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Позволяет применить миграцию с меньшей версией (V3.1) там, где V4 уже применена.
spring.flyway.out-of-order=true
# В миграциях нет плейсхолдеров; отключаем подстановку ${...}, чтобы случайный
# текст (например, ${file.upload-dir} в комментарии) не ронял разбор SQL.
spring.flyway.placeholder-replacement=false
server.port=8081
file.upload-dir=/home/edmvl/bot_files/
spring.servlet.multipart.max-file-size=20MB
# Ограничение возраста Telegram WebApp initData в секундах (0 — не проверять).
# Слишком маленькое значение может приводить к отказу доступа без переоткрытия Mini App.
telegram.webapp.auth.max-age-seconds=0
# Ключ JavaScript API Яндекс.Карт для страниц квестов. Пусто — карта отключена,
# координаты чекпоинтов вводятся вручную.
yandex.maps.api-key=${YANDEX_MAPS_API_KEY:}
