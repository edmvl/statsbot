# Шаблон ЛОКАЛЬНОЙ среды (коммитится, без секретов).
# Как пользоваться: скопировать в config/application-local.properties (папка в .gitignore)
# и подставить реальные значения. Профиль local включён по умолчанию.

telegram.bot.username=your_test_bot
telegram.bot.token=REPLACE_WITH_REAL_TEST_TOKEN
spring.datasource.url=jdbc:postgresql://localhost:5432/tgbot
spring.datasource.username=postgres
spring.datasource.password=REPLACE_WITH_REAL_PASSWORD

# Ключ JavaScript API Яндекс.Карт для страниц квестов.
# Можно оставить пустым — тогда карта отключена, координаты вводятся вручную.
yandex.maps.api-key=
